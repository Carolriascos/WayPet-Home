services:
  postgres:
    image: postgres:17-alpine
    container_name: waypet-home-db
    restart: unless-stopped
    ports:
      - "${DB_PORT:-5433}:5432"
    environment:
      POSTGRES_DB: ${DB_DATABASE:-waypet_home}
      POSTGRES_USER: ${DB_USERNAME:-postgres}
      POSTGRES_PASSWORD: ${DB_PASSWORD:?Falta DB_PASSWORD en el archivo .env}
    volumes:
      - waypet_home_data:/var/lib/postgresql/data

volumes:
  waypet_home_data: